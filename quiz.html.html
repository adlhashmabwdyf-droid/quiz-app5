<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختبار الصرف: إبدال الياء والواو</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; color: #333; line-height: 1.6; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h1, h2 { text-align: center; color: #2c3e50; }
        .section-title { background: #3498db; color: white; padding: 10px; border-radius: 5px; margin-top: 30px; }
        .question-block { margin-bottom: 25px; padding-bottom: 15px; border-bottom: 1px solid #eee; }
        .question-text { font-weight: bold; margin-bottom: 10px; font-size: 1.1em; }
        .options label { display: block; margin-bottom: 8px; cursor: pointer; background: #f9f9f9; padding: 10px; border-radius: 5px; transition: background 0.3s; }
        .options label:hover { background: #e9e9e9; }
        input[type="text"], textarea { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 5px; font-family: inherit; }
        .btn-submit { display: block; width: 100%; padding: 15px; background: #27ae60; color: white; border: none; border-radius: 5px; font-size: 1.2em; cursor: pointer; margin-top: 30px; }
        .btn-submit:hover { background: #219150; }
        #result { display: none; text-align: center; margin-top: 30px; padding: 20px; background: #e8f8f5; border: 2px solid #27ae60; border-radius: 10px; font-size: 1.5em; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h1>اختبار إبدال الواو والياء</h1>
    <form id="quizForm">

        <!-- القسم الأول: الاختيار من متعدد -->
        <h2 class="section-title">أولاً: اختر الإجابة الصحيحة</h2>
        <div id="mcq-section"></div>

        <!-- القسم الثاني: أكمل الفراغ -->
        <h2 class="section-title">ثانياً: أكمل الفراغات التالية</h2>
        <div id="fill-section"></div>

        <!-- القسم الثالث: ضع علامة صح أو خطأ -->
        <h2 class="section-title">ثالثاً: ضع علامة (صح) أو (خطأ) مع التصحيح والتعليل</h2>
        <div id="tf-section"></div>

        <!-- القسم الرابع: الحكم الصرفي -->
        <h2 class="section-title">رابعاً: بيّن الحكم الصرفي مع التمثيل والتعليل</h2>
        <p style="color: #e74c3c; font-size: 0.9em;">* هذا القسم مخصص للإجابات المقالية وسيراجعها المعلم يدوياً ولا تدخل في التصحيح التلقائي.</p>
        <div id="essay-section"></div>

        <button type="button" class="btn-submit" onclick="calculateScore()">إنهاء الاختبار وعرض النتيجة</button>
    </form>

    <div id="result"></div>
</div>

<script>
    // بيانات الأسئلة
    const mcqQuestions = [
        { q: "كلمة التي أُبدلت فيها الياء واواً لوقوعها ساكنة مفردة بعد ضم في اسم غير جمع هي:", options: ["مُوقِظ", "هُيَّام", "بِيض", "خِزْيَا"], correct: 0 },
        { q: "العلة الصرفية في عدم إبدال الياء واواً في كلمة (هُيَّام) هي:", options: ["لأن الياء متطرفة", "لأن الياء مشددة وليست مفردة", "لأن الياء وقعت في جمع", "لأن الياء مفتوحة وما قبلها ساكن"], correct: 1 },
        { q: "أصل كلمة (تَقْوَى) قبل حدوث الإعلال بالإبدال هو:", options: ["تَقْوَو", "تَقْيَى", "تُقِيّ", "تَقْوَاء"], correct: 1 },
        { q: "الإبدال في كلمة (طُوبَى) قياسي؛ لأن الياء وقعت:", options: ["لاماً لـ (فُعْلَى) اسماً", "عيناً لـ (فُعْلَى) اسماً", "عيناً لـ (فُعْلَى) وصفاً", "عين الفعل المضموم العين"], correct: 1 },
        { q: "كلمة (ضِيزَى) كُسرت فاؤها وسَلِمَت ياؤها من الإبدال لأنها:", options: ["اسم على وزن (فُعْلَى)", "وصف على وزن (فُعْلَى) خيف فيه الالتباس بالاسم", "جمع على وزن (فُعَّل)", "اسم على وزن (فَعْلَى)"], correct: 1 },
        { q: "الحكم الصرفي للإبدال في قولنا: 'حَكَمَ القَاضِي بِحُكْمٍ ضُوقَى' هو:", options: ["شاذ قياساً واستعمالاً", "قياسي مطرد", "شاذ قياساً فصيح استعمالاً", "ممتنع ويجب التصحيح"], correct: 2 },
        { q: "العلة في صحة الياء وعدم إبدالها واواً في كلمة (خِزْيَا) هي:", options: ["لأنها اسم على وزن (فُعْلَى)", "لأنها وصف على وزن (فَعْلَى)", "لأن الياء وقعت عيناً لا لاماً", "لأن ما قبلها مضموم"], correct: 1 },
        { q: "الشاهد الصرفي الشاذ الذي أُبدلت فيه الياء واواً في الوصف على وزن (فَعْلَى) هو:", options: ["فَتْوَى", "طُغْيَا (طُغْوَى)", "مَصْطَفَى", "رَضِيَ"], correct: 1 },
        { q: "عند صياغة الفعل الماضي المضموم العين من المادة (ن هـ ي) يقال:", options: ["نَهِيَ الرجلُ", "نَهَى الرجلُ", "نَهَوَ الرجلُ", "أْنَهَى الرجلُ"], correct: 2 },
        { q: "الكلمة التي سلمت فيها الياء من الإبدال واواً لأنها وقعت في جمع تكسير هي:", options: ["موقن", "بِيض", "فتوى", "طوبى"], correct: 1 },
        { q: "الحكم الصرفي لكلمة (حِيكَى) عند من ضَمَّ الفاء وقَلَب الياء واواً (حُوكَى) في الوصف هو:", options: ["قياسي مطرد", "شاذ قياساً", "واجب التصحيح", "ممتنع قياساً واستعمالاً"], correct: 1 },
        { q: "أصل كلمة (مُوقِن) الصرفي هو:", options: ["مُيْقِن", "مَوْقِن", "مُوَقِّن", "مَيِقِن"], correct: 0 },
        { q: "الشرط القياسي الأول لإبدال الواو والياء ألفاً في نحو (قَالَ، بَاعَ) هو:", options: ["أن تكون حركتهما عارضة", "تحرك الواو والياء بحركة أصلية", "سكون ما قبلهما", "وقوعهما بعد فتحة عارضة"], correct: 1 },
        { q: "العلة الصرفية في عدم إبدال الياء ألفاً في كلمة (جَيَل) هي:", options: ["انكسار ما قبل الياء", "سكون الياء", "الفتحة قبلها غير متصلة", "الياء متطرفة"], correct: 2 },
        { q: "لم تُبدل الواو ألفاً في عبارة (الطَّالِبُ وَثَبَ) لأن:", options: ["حركة الواو عارضة", "الفتحة السابقة للواو غير متصلة بها في كلمة واحدة", "ما بعد الواو معتل", "الواو ساكنة"], correct: 1 },
        { q: "الامتناع عن إبدال الواو والياء ألفاً في نحو (عُوِرَ، غَيِدَ) علته الصرفية هي:", options: ["سكون حرف العلة", "انكسار ما قبل حرف العلة وإتيان الوصف منهما على (أَفْعَل)", "انفتاح ما بعد حرف العلة", "حركة حرف العلة عارضة"], correct: 1 },
        { q: "يُشرط لإبدال الواو والياء ألفاً ألا يقع بعدهما ساكن، ولذا صحّت الواو ولم تُبدل في:", options: ["قَال", "جَوَلَان", "دَعَا", "رمَى"], correct: 1 },
        { q: "كلمة (آيَة) أصلها الصرفي المباشر قبل الإعلال والقلب هو:", options: ["أَيَيَة", "أَايَة", "أَيَة", "آيِيَة"], correct: 0 },
        { q: "تصح الواو والياء ولا تُبدلان ألفاً إذا كانتا عيناً لـ (فَعِلَ) الذي الوصف منه على:", options: ["فَاِعل", "أَفْعَل", "مَفْعُول", "فَعِيل"], correct: 1 },
        { q: "العلة في عدم إبدال الواو ألفاً في كلمة (اجْتَوَرُوا) هي:", options: ["لأنها عيناً لـ (افتعل) الدال على الجمع", "لأنها عيناً لـ (افتعل) الدال على المفاعلة والاشتراك", "لأن الواو ساكنة", "لأن ما قبلها مكسور"], correct: 1 },
        { q: "سلمت الواو من الإبدال ألفاً في جمع التكسير (خَوَنَة) لأنها عيناً لـ (فَعَلَة) الدال على:", options: ["التأنيث", "الجمع الصحيح الالم", "المصدرية", "الوصفية المفردة"], correct: 1 },
        { q: "الكلمة الشاذة قياساً للزوم الإعلال والقلب فيها مع تصحيح العرب لها هي:", options: ["حَيَدَى", "قَامَ", "صَافَى", "دَعَا"], correct: 0 },
        { q: "أصل كلمة (مَصْطَفَى) الصرفي الذي وقعت فيه الياء متطرفة بعد فتح فَقُلبت ألفاً هو:", options: ["مَصْطَفَو", "مَصْطَفَي", "مَصْطَفِأ", "مَصْطَفُي"], correct: 1 },
        { q: "أُبدلت الواو والياء ألفاً في (دَعَا، رَمَى) لتحركهما وانفتاح ما قبلهما وتطرفهما:", options: ["تطرفاً حكمياً", "تطرفاً حقيقياً", "عدم التطرف", "تطرفاً عارضاً"], correct: 1 },
        { q: "الامتناع عن إبدال الياء ألفاً في كلمة (حَيْدَى) علته أنها:", options: ["خرجت على القياس وشذت بالتصحيح الاستعمالي", "سكنت الياء فيها", "انكسر ما قبلها", "وقع بعدها معتل"], correct: 0 }
    ];

    const fillQuestions = [
        "تُبدل الياء واواً قياساً في أربعة مواضع، الموضع الأول إذا وقعت الياء ساكنة مفردة في غير جمع بعد ..........",
        "أصل كلمة (مُوقِظ) قبل حدوث الإعلال هو ..........، قُلبت فيه الياء واواً لـ ..........",
        "لا تُبدل الياء واواً في نحو (هُيَّام)؛ لأن الياء جاءت .......... وليست مفردة.",
        "الشَرْط الصرفي لإبدال الياء واواً في نحو (تَقْوَى) هو وقوع الياء لاماً لـ (فُعْلَى) ..........",
        "كلمة (ضُوقَى) اسم أُبدلت فيه الياء واواً لأن الياء وقعت عيناً لـ ..........",
        "يُستثنى من إبدال الياء واواً في عين (فُعْلَى) الوصف السالم نحو (ضِيزَى)، حيث تُكسر الفاء لتسلم ..........",
        "الحكم الصرفي لكلمة (خِزْيَا) هو صحة الياء وعدم إبدالها؛ لأنها وصف على وزن ..........",
        "الإبدال في نحو (طُغْيَا) بالواو (طُغْوَى) يُعدّ شاذّاً قياساً؛ لأن الياء وقعت لام وصف لا لام ..........",
        "إذا صيغ من الفعل الناقص اليائي فعلٌ على وزن (فَعُلَ) بضم العين مثل (نَهَوَ)، فإن الياء تُبدل ..........",
        "تصح الياء ولا تُبدل واواً في جمع التكسير نحو (بِيض)؛ لأن الكلمة جاءت ..........",
        "الحكم الصرفي لإبدال الياء واواً في الصفة على وزن (فُعْلَى) نحو (حُوكَى) هو أنها ..........",
        "الكلمة الصفة التي جاءت على وزن (فَعْلَى) وأُبدلت ياؤها واواً شذوذاً قياسياً في قولهم 'رَجُلٌ شَرْوَى هَذَا' أصلها قبل الإبدال هو ..........",
        "قلب الواو والياء ألفاً يُشترط تحركهما بحركة .......... غير عارضة."
    ];

    const tfQuestions = [
        "بدل الياء واواً قياساً مطرداً إذا وقعت ساكنة مفردة بعد فتح في غير جمع.",
        "كلمة (مُوقِن) أصلها الصرفي (مُيْقِن)، والإبدال فيها قياسي لوقوع الياء ساكنة مفردة بعد ضم.",
        "تصح الياء في (هُيَّام) وتُبدل واواً في (بِيض)؛ لأن الأول جمع والثاني مفرد.",
        "الإبدال في كلمة (تَقْوَى) شاذ قياساً؛ لأن الياء وقعت لامًا لـ (فُعْلَى) اسماً وكان القياس تصحيحها.",
        "كلمة (طُوبَى) اسم أُبدلت فيه الياء واواً لوقوعها عيناً لـ (فُعْلَى) اسماً.",
        "يُقال في الوصف السالم من الطغيان (طُغْوَى) بالإبدال قياساً مطرداً.",
        "كلمة (ضِيزَى) أصلها (ضُيْزَى) وقُلبت الواو ياء شذوذاً قياسياً مع فصاحتها استعمالاً.",
        "يجب إبدال الياء واواً إذا وقعت لامًا لـ (فَعْلَى) وصفاً نحو (خِزْيَا) و(صَدْيَا).",
        "يُبدل حرف العلة الياء واواً إذا تحول الفعل اليائي إلى باب (فَعُلَ) بضم العين نحو (نَهَوَ).",
        "كلمة (حِيكَى) تصح فيها الياء وتُكسر فاؤها لمنع إبدال الياء واواً في الوصف.",
        "يُشترط لإبدال الواو والياء ألفاً أن يتحرك الحرفان وأن ينفتح ما بعدهما مباشرة.",
        "كلمة (جَيَل) تُبدل فيها الياء ألفاً لتوافر شرط الحركة وانفتاح ما قبلها.",
        "امتنع الإعلال بالقلب في (الطَّالِبُ وَثَبَ) لأن فتحة ما قبل الواو فتحة عارضة غير متصلة.",
        "يُعتل الفعل (عُوِرَ) بقلب الواو ألفاً كالفعل (قَالَ) لتوافر الشروط العشرة.",
        "تصح الواو ولا تُبدل ألفاً في مصدر الفعل الدال على الحركة والتنقل نحو (جَوَلَان)."
    ];

    const essayQuestions = [
        "إذا وقعت الياء عيناً لـ (فُعْلَى) اسماً.",
        "إذا وقعت الياء عيناً لـ (فُعْلَى) وصفاً نعتياً غير جارٍ مجرى الأسماء.",
        "إذا وقعت الياء لامًا لـ (فُعْلَى) اسماً.",
        "إذا وقعت الياء لامًا لـ (فَعْلَى) وصفاً.",
        "إذا تحركت الواو أو الياء حركة أصلية وانفتح ما قبلهما وتطرفتا تطرفاً حقيقياً أو حكمياً.",
        "إذا تحركت الواو أو الياء بعد فتح في اسم أو فعل يدل على المشاركة على وزن (افتعل).",
        "إذا وقعت الواو أو الياء عيناً لاسم جمع على وزن (فَعَلَة).",
        "إذا تحركت الواو أو الياء بعد فتحة وكان الحرف التالي لهما ساكناً في كلمة واحدة.",
        "إذا وقعت الياء ساكنة مفردة بعد ضم في غير جمع.",
        "إذا وقعت الياء ساكنة غير مفردة (مشددة) بعد ضم.",
        "إذا وقعت الياء ساكنة مفردة بعد ضم في جمع تكسير.",
        "إذا صِيغَ من الفعل الناقص اليائي فعل ماضٍ أو مضارع على وزن (فَعُلَ) بضم العين.",
        "إذا تحركت الواو والياء بعد فتح وكان ما قبلهما غير متصل بهما في نفس الكلمة.",
        "إذا تحركت الواو أو الياء بعد فتحة عارضة غير أصلية.",
        "إذا وقعت الواو عيناً لـ (فَعِلَ) الذي الوصف منه على (أَفْعَل).",
        "إذا وقعت الياء عيناً لـ (فَعِلَ) الذي الوصف منه على (أَفْعَل).",
        "إذا تحركت الواو أو الياء بعد فتح ووقع بعدهما حرف معتل متصل بهما في نفس الكلمة (نحو آية وغايَة).",
        "إذا وقعت الياء لامًا لـ (فُعْلَى) وصفاً مطرداً.",
        "إذا وقعت الياء عيناً لـ (فُعْلَى) وصفاً واستُعملت في الكلام بكسر الفاء لتسلم الياء (نحو ضِيزَى).",
        "إذا تحركت الواو والياء بعد فتحة أصلية واستوفتا الشروط العشرة في فعل ثلاثي.",
        "إذا وقعت الياء لامًا لـ (فَعْلَى) اسماً غير وصف.",
        "إذا وقعت الواو عيناً لـ (فَعَلَة) دالة على التأنيث.",
        "إذا تحركت الياء أو الواو بعد فتح وجاء بعدها ألف دالة على المبالغة والحركة (نحو جولان وحيدى).",
        "إذا وقعت الياء لامًا لـ (فَعْلَى) وصفاً وأُبدلت واواً شذوذاً (نحو طُغْوَى وشَرْوَى).",
        "إذا تحركت الياء والواو بعد فتح وسكن الحرف الذي قبلهما مباشرة."
    ];

    // توليد أسئلة الاختيار من متعدد
    const mcqDiv = document.getElementById('mcq-section');
    mcqQuestions.forEach((q, index) => {
        let html = `<div class="question-block"><div class="question-text">${index + 1}. ${q.q}</div><div class="options">`;
        q.options.forEach((opt, optIndex) => {
            html += `<label><input type="radio" name="mcq${index}" value="${optIndex}"> ${opt}</label>`;
        });
        html += `</div></div>`;
        mcqDiv.innerHTML += html;
    });

    // توليد أسئلة أكمل الفراغ
    const fillDiv = document.getElementById('fill-section');
    fillQuestions.forEach((q, index) => {
        let parts = q.split("..........");
        let html = `<div class="question-block"><div class="question-text">${index + 1}. `;
        for(let i=0; i<parts.length; i++) {
            html += parts[i];
            if(i < parts.length - 1) {
                html += `<input type="text" style="width: 150px; display:inline;" name="fill${index}_${i}">`;
            }
        }
        html += `</div></div>`;
        fillDiv.innerHTML += html;
    });

    // توليد أسئلة صح وخطأ
    const tfDiv = document.getElementById('tf-section');
    tfQuestions.forEach((q, index) => {
        tfDiv.innerHTML += `
            <div class="question-block">
                <div class="question-text">${index + 1}. ${q}</div>
                <label><input type="radio" name="tf${index}" value="true"> صح</label>
                <label><input type="radio" name="tf${index}" value="false"> خطأ</label>
                <input type="text" placeholder="التصحيح (إن وجد)..." name="tf_corr${index}">
                <input type="text" placeholder="العلة الصرفية..." name="tf_reason${index}">
            </div>`;
    });

    // توليد أسئلة الحكم الصرفي
    const essayDiv = document.getElementById('essay-section');
    essayQuestions.forEach((q, index) => {
        essayDiv.innerHTML += `
            <div class="question-block">
                <div class="question-text">${index + 1}. ${q}</div>
                <textarea rows="3" placeholder="اكتب الحكم الصرفي مع التمثيل والتعليل هنا..."></textarea>
            </div>`;
    });

    // دالة حساب الدرجة
    function calculateScore() {
        let score = 0;
        let total = mcqQuestions.length; // يتم التصحيح التلقائي للاختيارات فقط كنموذج

        // حساب درجات الاختيار من متعدد
        mcqQuestions.forEach((q, index) => {
            const selected = document.querySelector(`input[name="mcq${index}"]:checked`);
            if (selected && parseInt(selected.value) === q.correct) {
                score++;
            }
        });

        const resultDiv = document.getElementById('result');
        resultDiv.style.display = 'block';
        resultDiv.innerHTML = `لقد أنهيت الاختبار! <br> الدرجة التلقائية (لقسم الاختياري): ${score} من ${total} <br> <span style="font-size:0.7em; color:#555;">(ملاحظة: باقي الأقسام تتطلب مراجعة المعلم)</span>`;
        window.scrollTo(0, document.body.scrollHeight);
    }
</script>
